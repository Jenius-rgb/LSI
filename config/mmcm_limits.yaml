    f_in_min:  {value: 10.0,   unit: MHz, page: null, verified: false}
    f_in_max:  {value: 800.0,  unit: MHz, page: null, verified: false}
    f_pfd_min: {value: 10.0,   unit: MHz, page: null, verified: false}
    f_pfd_max: {value: 450.0,  unit: MHz, page: null, verified: false}
    f_vco_min: {value: 600.0,  unit: MHz, page: null, verified: false}
    f_vco_max: {value: 1200.0, unit: MHz, page: null, verified: false}
    f_out_max: {value: 800.0,  unit: MHz, page: null, verified: false}
  "-2":
    f_in_min:  {value: 10.0,   unit: MHz, page: null, verified: false}
    f_in_max:  {value: 933.0,  unit: MHz, page: null, verified: false}
    f_pfd_min: {value: 10.0,   unit: MHz, page: null, verified: false}
