# MMCM limits per speed grade, for tools/gen_mmcm_table.py.
#
# These values are PROVISIONAL. They were entered from general knowledge of 7-series
# parts, without the data sheet at hand. Before the board phase, check each one against
# AMD DS189 (Spartan-7 data sheet), table "MMCM Switching Characteristics", write the page
# number in `page`, and set `verified: true`.
source: "AMD DS189, MMCM Switching Characteristics (NOT YET CHECKED)"
speed_grades:
